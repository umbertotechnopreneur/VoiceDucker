name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore locked packages
        run: dotnet restore VoiceDucker.csproj --locked-mode -p:Platform=x64 -r win-x64
      - name: Build x64 Debug
        run: dotnet build VoiceDucker.csproj -c Debug -p:Platform=x64 -r win-x64 --no-restore
